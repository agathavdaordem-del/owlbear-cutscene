<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cutscene</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      #stage.dim { background: rgba(0, 0, 0, 0.82); }
      #stage.on { opacity: 1; }

      #img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: none;
      }
      #stage.cover #img { object-fit: cover; }

      /* Barras de cinema */
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        height: 0;
        background: #000;
        transition: height 0.9s ease;
        z-index: 2;
      }
      .bar.top { top: 0; }
      .bar.bottom {
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #stage.bars .bar { height: 12vh; }

      #caption {
        color: #fff;
        font-size: clamp(16px, 3vh, 34px);
        letter-spacing: 0.04em;
        text-align: center;
        padding: 0 5vw;
        opacity: 0;
        transition: opacity 1s ease 0.9s;
      }
      #stage.bars #caption { opacity: 1; }

      /* Legenda sem barras: faixa na parte de baixo */
      #captionFloat {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 6vh;
        text-align: center;
        color: #fff;
        font-size: clamp(16px, 3.2vh, 36px);
        text-shadow: 0 2px 10px #000, 0 0 3px #000;
        padding: 0 6vw;
        z-index: 2;
      }

      #hint {
        position: fixed;
        top: 12px;
        right: 16px;
        color: rgba(255, 255, 255, 0.55);
        font-size: 12px;
        z-index: 3;
        display: none;
      }

      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 14px;
        z-index: 1;
      }
      .spin {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(255, 255, 255, 0.25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: s 0.8s linear infinite;
      }
      @keyframes s { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="loader"><div class="spin"></div></div>
      <img id="img" alt="" />
      <div class="bar top"></div>
      <div class="bar bottom"><div id="caption"></div></div>
      <div id="captionFloat"></div>
      <div id="hint">clique ou Esc para fechar</div>
    </div>
    <script type="module" src="./cutscene.js"></script>
  </body>
</html>
